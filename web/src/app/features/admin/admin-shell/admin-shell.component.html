<div class="shell">
  <header class="topbar">
    <a routerLink="/admin" class="brand">Guestify <span>Admin</span></a>

    @if (auth.profile()?.role === 'superadmin') {
      <nav class="nav">
        <a routerLink="/admin/hotels" routerLinkActive="active">სასტუმროები</a>
        <a routerLink="/admin/ai-topic-templates" routerLinkActive="active">AI თემების ბიბლიოთეკა</a>
      </nav>
    } @else if (auth.profile()?.role === 'hotel_admin') {
      <nav class="nav">
        <a routerLink="/admin/content" routerLinkActive="active">ჩემი კონტენტი</a>
      </nav>
    }

    <div class="who">
      <span class="name">{{ auth.profile()?.full_name || auth.session()?.user?.email }}</span>
      <span class="role">{{ auth.profile()?.role }}</span>
      <button type="button" (click)="signOut()">გასვლა</button>
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
