@if (loading()) {
  <p class="empty">იტვირთება…</p>
} @else {
  @if (items().length === 0) {
    <p class="empty">წესები ჯერ არ დამატებულა</p>
  }

  @for (item of items(); track item.id) {
    <div class="row" [class.editing]="editingId() === item.id">
      <div class="icn"><app-icon [name]="iconFor(item.icon)" [size]="16" /></div>
      <div class="info">
        <p class="t">{{ item.title_ka }}</p>
      </div>
      <button type="button" class="link-btn" (click)="edit(item)">რედაქტირება</button>
      <button type="button" class="link-btn danger" (click)="remove(item.id)">წაშლა</button>
    </div>
  }

  <form class="panel" (ngSubmit)="submit()">
    <h2>{{ editingId() ? 'წესის რედაქტირება' : 'ახალი წესი' }}</h2>

    @if (error()) {
      <p class="error-banner">{{ error() }}</p>
    }

    <app-icon-picker [(icon)]="form.icon" />

    <div class="lang-grid">
      <label>
        <span>სათაური (ქარ) *</span>
        <input name="title_ka" [(ngModel)]="form.title_ka" required />
      </label>
      <label>
        <span>Title (EN)</span>
        <input name="title_en" [(ngModel)]="form.title_en" />
      </label>
      <label>
        <span>Название (RU)</span>
        <input name="title_ru" [(ngModel)]="form.title_ru" />
      </label>
    </div>

    <label class="sort">
      <span>რიგითობა</span>
      <input type="number" name="sort_order" [(ngModel)]="form.sort_order" />
    </label>

    <div class="actions">
      <button type="submit" [disabled]="saving()">{{ saving() ? 'ინახება…' : editingId() ? 'განახლება' : 'დამატება' }}</button>
      @if (editingId()) {
        <button type="button" class="ghost" (click)="cancelEdit()">გაუქმება</button>
      }
    </div>
  </form>
}
