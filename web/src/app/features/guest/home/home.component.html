<section class="hero-greet">
  <h2>{{ "greet_title" | translate }}</h2>
  <p>{{ "greet_sub" | translate }}</p>
</section>

<div class="card-grid">
  @for (card of cards; track card.route; let i = $index) {
    <a class="nav-card" [routerLink]="card.route" [style.--i]="i">
      <div class="icon-row">
        <div class="icn"><app-icon [name]="card.icon" [size]="20" /></div>
        <app-icon class="chevron" name="chevron_right" [size]="14" />
      </div>
      <div class="t">{{ card.titleKey | translate }}</div>
      <div class="d">{{ card.descKey | translate }}</div>
    </a>
  }
</div>
