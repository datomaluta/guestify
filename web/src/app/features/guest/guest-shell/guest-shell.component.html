@if (hotelContext.notFound()) {
  <div class="state-screen">
    <h1>{{ 'app_error_hotel_not_found_title' | translate }}</h1>
    <p>{{ 'app_error_hotel_not_found_desc' | translate }}</p>
  </div>
} @else if (!hotelContext.hotel()) {
  <div class="state-screen">
    <p>{{ 'app_loading' | translate }}</p>
  </div>
} @else {
  <div class="app-shell">
    <main class="app-body">
      <header class="app-header">
        <span class="wordmark">check<span class="accent">it</span></span>
        <app-lang-dropdown />
      </header>

      <router-outlet />
    </main>

    <app-bottom-nav />
  </div>
}
