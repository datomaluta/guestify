<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Guestify</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
  <style>
    /* პირველადი loader — Angular-ის ჩატვირთვამდეც ჩანს, JS/CSS bundle-ისა და hotel-resolver-ის დროს ცარიელი ეკრანის ნაცვლად. */
    #initial-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #faf9f6;
      transition: opacity 0.25s ease;
    }

    #initial-loader.done {
      opacity: 0;
      pointer-events: none;
    }

    #initial-loader .wordmark {
      display: inline-flex;
      font-family: 'Inter', 'Noto Sans Georgian', system-ui, sans-serif;
      font-weight: 800;
      font-size: 34px;
      letter-spacing: -0.02em;
      color: #111827;
    }

    #initial-loader .part-check {
      animation: loader-check-in 0.5s ease-out both;
    }

    #initial-loader .part-it {
      display: inline-block;
      transform-origin: left center;
      color: #111827;
      animation:
        loader-it-land 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.35s both,
        loader-it-glow 1.5s ease-in-out 0.95s infinite;
    }

    @keyframes loader-check-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes loader-it-land {
      0% { opacity: 0; transform: translateX(22px) scale(0.8); }
      55% { opacity: 1; transform: translateX(-2px) scale(1.1); }
      80% { transform: translateX(1px) scale(0.96); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }

    @keyframes loader-it-glow {
      0%, 100% { color: #111827; }
      50% { color: #3b82f6; }
    }

    @media (prefers-reduced-motion: reduce) {
      #initial-loader .part-check,
      #initial-loader .part-it {
        animation: none;
        opacity: 1;
      }
      #initial-loader .part-it { color: #3b82f6; }
    }
  </style>
</head>
<body>
  <div id="initial-loader">
    <span class="wordmark"><span class="part-check">check</span><span class="part-it">it</span></span>
  </div>
  <app-root></app-root>
</body>
</html>
