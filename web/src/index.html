<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Guestify</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
  <style>
    /* პირველადი loader — Angular-ის ჩატვირთვამდეც ჩანს, JS/CSS bundle-ისა და hotel-resolver-ის დროს ცარიელი ეკრანის ნაცვლად. */
    #initial-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #faf9f6;
      transition: opacity 0.25s ease;
    }

    #initial-loader.done {
      opacity: 0;
      pointer-events: none;
    }

    /* QR-სკანერის ჩარჩო — პროდუქტი QR კოდით იხსნება, ასე რომ loader-იც ამ იდეაზეა აგებული:
       "სკანირდება" და შედეგად ჩნდება checkit. */
    #initial-loader .scan-frame {
      position: relative;
      width: 200px;
      height: 104px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #initial-loader .corner {
      position: absolute;
      width: 20px;
      height: 20px;
      opacity: 0;
      animation: loader-corner-in 0.35s ease-out both;
    }

    #initial-loader .corner.tl { top: 0; left: 0; border-top: 3px solid #111827; border-left: 3px solid #111827; }
    #initial-loader .corner.tr { top: 0; right: 0; border-top: 3px solid #111827; border-right: 3px solid #111827; animation-delay: 0.05s; }
    #initial-loader .corner.bl { bottom: 0; left: 0; border-bottom: 3px solid #111827; border-left: 3px solid #111827; animation-delay: 0.1s; }
    #initial-loader .corner.br { bottom: 0; right: 0; border-bottom: 3px solid #111827; border-right: 3px solid #111827; animation-delay: 0.15s; }

    #initial-loader .scan-line {
      position: absolute;
      left: 4px;
      right: 4px;
      top: 4px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #3b82f6, transparent);
      box-shadow: 0 0 8px 1px rgba(59, 130, 246, 0.55);
      opacity: 0;
      animation: loader-scan-sweep 2.1s ease-in-out 0.4s infinite;
    }

    #initial-loader .wordmark {
      display: inline-flex;
      font-family: 'Inter', 'Noto Sans Georgian', system-ui, sans-serif;
      font-weight: 800;
      font-size: 32px;
      letter-spacing: -0.02em;
      color: #111827;
      opacity: 0;
      transform: scale(0.92);
      animation: loader-wordmark-in 0.5s ease-out 0.55s both;
    }

    #initial-loader .part-it {
      color: #3b82f6;
    }

    @keyframes loader-corner-in {
      from { opacity: 0; transform: scale(1.5); }
      to { opacity: 0.9; transform: scale(1); }
    }

    @keyframes loader-scan-sweep {
      0% { top: 4px; opacity: 0; }
      10% { opacity: 1; }
      50% { top: calc(100% - 6px); opacity: 1; }
      90% { opacity: 1; }
      100% { top: 4px; opacity: 0; }
    }

    @keyframes loader-wordmark-in {
      to { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      #initial-loader .corner,
      #initial-loader .wordmark { animation: none; opacity: 0.9; }
      #initial-loader .wordmark { opacity: 1; transform: none; }
      #initial-loader .scan-line { display: none; }
    }
  </style>
</head>
<body>
  <div id="initial-loader">
    <div class="scan-frame">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>
      <span class="scan-line"></span>
      <span class="wordmark"><span class="part-check">check</span><span class="part-it">it</span></span>
    </div>
  </div>
  <app-root></app-root>
</body>
</html>
