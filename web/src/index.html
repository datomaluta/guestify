    <style>
      /* სანამ loader ჩანს, გვერდს სქროლი ეკრძალება — თორემ ქვემოთ Angular-ის კონტენტის
       რენდერის დროს scrollbar-ის გაჩენა/გაქრობა viewport-ის სიგანეს ცვლის და fixed,
       ცენტრირებული loader-ი გვერდზე "ხტება" (განსაკუთრებით შესამჩნევია, როცა DevTools
       ღიაა და გვერდის ეფექტური სიგანე უფრო ვიწროა). html.app-revealed დაემატება
       loader-ის მოშორებისთანავე (იხ. app.component.ts) და სქროლი უბრუნდება რეალურ გვერდს. */
      html:not(.app-revealed) {
        overflow: hidden;
      }

      /* პირველადი loader — Angular-ის ჩატვირთვამდეც ჩანს, JS/CSS bundle-ისა და hotel-resolver-ის დროს ცარიელი ეკრანის ნაცვლად. */
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf9f6;
        transition: opacity 0.25s ease;
      }

      #initial-loader.done {
        opacity: 0;
        pointer-events: none;
      }

      /* QR-სკანერის ჩარჩო — პროდუქტი QR კოდით იხსნება, ასე რომ loader-იც ამ იდეაზეა აგებული:
       ნამდვილი 21x21 QR მატრიცა (finder pattern-ები, timing pattern და მკვრივი მონაცემი),
       რომელიც "იწერება", შემდეგ "სკანირდება" და შედეგად ჩნდება checkit. */
      #initial-loader .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }

      #initial-loader .scan-frame {
        position: relative;
        width: 150px;
        height: 150px;
      }

      /* გარსი, რომლის ზომა ემთხვევა მთელი QR ნიმუშის ვიზუალურ ფართობს (126x126) — scale-in
       ანიმაცია ამაზეა, რომ transform-origin ნიმუშის ცენტრში მოხვდეს და არა შიდა 6px
       უჯრედის კუთხეში (რაც "ნახტომს"/წანაცვლებას იწვევდა). */
      #initial-loader .qr-pattern {
        position: absolute;
        left: 12px;
        top: 12px;
        width: 126px;
        height: 126px;
        opacity: 0;
        transform: scale(0.9);
        animation: loader-qr-in 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s both;
      }

      /* ერთი 6px უჯრედი, რომლის box-shadow სიაში დაწერილია მთელი QR მატრიცის დანარჩენი
       ყველა მუქი მოდული — ასე მთელი ნიმუში ერთ ელემენტადაა დახატული, ნამდვილი QR კოდის
       სიმჭიდროვით. მატრიცა გენერირებულია სკრიპტით (finder pattern-ები + timing pattern +
       სტაბილური ფსევდო-შემთხვევითი მონაცემი). */

      #initial-loader .scan-line {
        position: absolute;
        left: 12px;
        right: 12px;
        top: 12px;
        height: 2px;
        background: linear-gradient(90deg, transparent, #3b82f6, transparent);
        box-shadow: 0 0 8px 1px rgba(59, 130, 246, 0.55);
        opacity: 0;
        animation: loader-scan-sweep 2.1s ease-in-out 0.6s infinite;
      }

      #initial-loader .wordmark {
        display: inline-flex;
        font-family: "Inter", "Noto Sans Georgian", system-ui, sans-serif;
        font-weight: 800;
        font-size: 32px;
        letter-spacing: -0.02em;
        color: #111827;
        opacity: 0;
        transform: scale(0.92);
        animation: loader-wordmark-in 0.5s ease-out 0.75s both;
      }

      #initial-loader .part-it {
        color: #3b82f6;
      }

      @keyframes loader-qr-in {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes loader-scan-sweep {
        0% {
          top: 12px;
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        50% {
          top: calc(100% - 14px);
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          top: 12px;
          opacity: 0;
        }
      }

      @keyframes loader-wordmark-in {
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #initial-loader .qr-pattern,
        #initial-loader .wordmark {
          animation: none;
          opacity: 1;
          transform: none;
        }
        #initial-loader .scan-line {
          display: none;
        }
      }

  <body>
    <div id="initial-loader">
      <div class="loader-content">
        <div class="scan-frame">
          <span class="qr-pattern">
            <span class="qr-modules"></span>
          </span>
          <span class="scan-line"></span>
        </div>
        <span class="wordmark"
          ><span class="part-check">check</span
          ><span class="part-it">it</span></span
        >
      </div>
    </div>
    <app-root></app-root>
  </body>
